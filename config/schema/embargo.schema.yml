---
condition.plugin.embargo_embargoed_condition:
  type: condition.plugin
  mapping:
    filter:
      type: text
      label: 'Node is embargoed'

embargo.settings:
  type: config_object
  mapping:
    contact_email:
      type: email
      label: 'Contact email for embargo notifications'
    notification_message:
      type: text
      label: 'Embargo notification message'

plugin.plugin_configuration.search_api_processor.embargo_join_processor:
  type: search_api.default_processor_configuration
  mapping:
    use_cross_collection_join:
      type: boolean
    cross_collection_ttl:
      type: integer
